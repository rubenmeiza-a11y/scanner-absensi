<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Scanner Absensi</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 20px;
    }

    h1 {
      margin-top: 0;
    }

    button {
      padding: 14px 25px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #status {
      margin: 20px 0;
      font-size: 18px;
    }

    #hasil {
      margin-top: 20px;
      padding: 15px;
      font-size: 20px;
    }

  </style>

</head>

<body>

<div class="container">

  <h1>📷 SCANNER ABSENSI</h1>

  <div id="status">
    Tekan tombol untuk membuka kamera
  </div>

  <button
    id="tombolKamera"
    onclick="mulaiScanner()"
  >
    📷 BUKA KAMERA
  </button>

  <div id="reader"></div>

  <div id="hasil"></div>

</div>


<script>

/* =========================
   URL GOOGLE APPS SCRIPT
========================= */

const API_URL =
  "https://script.google.com/a/macros/admin.sd.belajar.id/s/AKfycby8EJnWuVNiHaraBqTjwfBkGmhikNSArEbArp8balvhDkN3xWGXgBOh_XVBkJjaQOTP/exec";


/* =========================
   VARIABEL
========================= */

let scanner = null;

let sedangMemproses = false;

let kameraAktif = false;


/* =========================
   SUARA BEEP
========================= */

function bunyiBeep() {

  try {

    const audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();


    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );


    oscillator.frequency.value = 1000;

    oscillator.type = "sine";


    gain.gain.setValueAtTime(
      0.3,
      audioContext.currentTime
    );


    oscillator.start();


    oscillator.stop(
      audioContext.currentTime + 0.2
    );

  }

  catch (error) {

    console.log(
      "Suara tidak dapat diputar",
      error
    );

  }

}


/* =========================
   MULAI SCANNER
========================= */

function mulaiScanner() {

  const status =
    document.getElementById("status");

  const hasil =
    document.getElementById("hasil");

  const tombol =
    document.getElementById("tombolKamera");


  hasil.innerHTML = "";


  if (kameraAktif) {

    return;

  }


  tombol.style.display =
    "none";


  scanner =
    new Html5Qrcode("reader");


  status.innerHTML =
    "⏳ Membuka kamera...";


  Html5Qrcode.getCameras()

    .then(function(cameras) {

      if (
        !cameras ||
        cameras.length === 0
      ) {

        throw new Error(
          "Kamera tidak ditemukan"
        );

      }


      let cameraId =
        cameras[0].id;


      const kameraBelakang =
        cameras.find(function(camera) {

          return /back|rear|environment/i.test(
            camera.label
          );

        });


      if (kameraBelakang) {

        cameraId =
          kameraBelakang.id;

      }


      return scanner.start(

        cameraId,

        {

          fps: 10,

          qrbox: {

            width: 250,

            height: 250

          }

        },

        qrBerhasil,

        function() {

          // QR belum terbaca

        }

      );

    })

    .then(function() {

      kameraAktif = true;


      status.innerHTML =
        "📷 Arahkan kamera ke QR Code";

    })

    .catch(function(error) {

      console.error(error);


      kameraAktif = false;


      tombol.style.display =
        "inline-block";


      status.innerHTML =
        "❌ Kamera tidak dapat dibuka";


      hasil.innerHTML =
        error.message ||
        String(error);

    });

}


/* =========================
   QR BERHASIL DIBACA
========================= */

function qrBerhasil(decodedText) {

  if (sedangMemproses) {

    return;

  }


  sedangMemproses = true;


  // BUNYI SAAT QR TERBACA
  bunyiBeep();


  document.getElementById("status")
    .innerHTML =
      "⏳ QR terbaca, memproses absensi...";


  if (scanner && kameraAktif) {

    scanner.stop()

      .then(function() {

        kameraAktif = false;

        kirimAbsensi(
          decodedText
        );

      })

      .catch(function() {

        kameraAktif = false;

        kirimAbsensi(
          decodedText
        );

      });

  }

  else {

    kirimAbsensi(
      decodedText
    );

  }

}


/* =========================
   KIRIM ABSENSI
========================= */

function kirimAbsensi(nis) {

  const hasil =
    document.getElementById("hasil");


  hasil.innerHTML =
    "⏳ Menyimpan absensi...";


  const callbackName =
    "callbackAbsensi_" +
    Date.now();


  window[callbackName] =
    function(data) {


      if (data.berhasil) {


        // BEEP BERHASIL
        bunyiBeep();


        document.getElementById("status")
          .innerHTML =
            "✅ ABSENSI BERHASIL";


        hasil.innerHTML =

          "<h2>🎉 Selamat Datang!</h2>" +

          "<h3>" +
          data.nama +
          "</h3>" +

          "<p>Kelas: <b>" +
          data.kelas +
          "</b></p>" +

          "<h2>✅ HADIR</h2>";


      }

      else {


        document.getElementById("status")
          .innerHTML =
            "❌ ABSENSI GAGAL";


        hasil.innerHTML =

          "<h3>" +
          data.pesan +
          "</h3>";

      }


      const script =
        document.getElementById(
          callbackName
        );


      if (script) {

        script.remove();

      }


      delete window[callbackName];


      /* =========================
         TUNGGU 3 DETIK
         LALU BUKA KAMERA LAGI
      ========================= */

      setTimeout(function() {


        sedangMemproses = false;


        document.getElementById("hasil")
          .innerHTML = "";


        mulaiScanner();


      }, 3000);

    };


  const script =
    document.createElement("script");


  script.id =
    callbackName;


  script.onerror =
    function() {


      document.getElementById("status")
        .innerHTML =
          "❌ Gagal menghubungi server";


      hasil.innerHTML =
        "Periksa link Google Apps Script.";


      sedangMemproses = false;


      setTimeout(function() {

        mulaiScanner();

      }, 3000);

    };


  script.src =

    API_URL +

    "?action=absensi" +

    "&nis=" +

    encodeURIComponent(nis) +

    "&callback=" +

    callbackName;


  document.body.appendChild(script);

}

</script>

</body>

</html>
