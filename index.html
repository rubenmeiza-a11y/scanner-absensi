<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Scanner Absensi</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 20px;
    }

    button {
      padding: 14px 25px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #status {
      margin: 20px 0;
      font-size: 18px;
    }

    #hasil {
      margin-top: 20px;
      padding: 15px;
      font-size: 20px;
    }

  </style>

</head>

<body>

<div class="container">

  <h1>📷 SCANNER ABSENSI</h1>

  <div id="status">
    Tekan tombol untuk membuka kamera
  </div>

  <button
    id="btnKamera"
    onclick="mulaiScanner()"
  >
    📷 BUKA KAMERA
  </button>

  <div id="reader"></div>

  <div id="hasil"></div>

</div>


<script>

/* =========================
   GOOGLE APPS SCRIPT
========================= */

const API_URL =
  "https://script.google.com/a/macros/admin.sd.belajar.id/s/AKfycby8EJnWuVNiHaraBqTjwfBkGmhikNSArEbArp8balvhDkN3xWGXgBOh_XVBkJjaQOTP/exec";


/* =========================
   VARIABEL
========================= */

let scanner = null;

let sedangMemproses = false;

let kameraAktif = false;

let audioContext = null;


/* =========================
   AKTIFKAN AUDIO
   Dipanggil saat tombol kamera
========================= */

function aktifkanAudio() {

  try {

    const AudioContextClass =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!audioContext) {

      audioContext =
        new AudioContextClass();

    }

    if (audioContext.state === "suspended") {

      audioContext.resume();

    }

  } catch (error) {

    console.log("Audio error:", error);

  }

}


/* =========================
   SUARA BEEP
========================= */

function beep(frequency, duration) {

  if (!audioContext) {
    return;
  }

  try {

    if (audioContext.state === "suspended") {

      audioContext.resume();

    }

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();


    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );


    oscillator.frequency.value =
      frequency;

    oscillator.type =
      "sine";


    gain.gain.setValueAtTime(
      0.3,
      audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      0.01,
      audioContext.currentTime +
      duration
    );


    oscillator.start();


    oscillator.stop(
      audioContext.currentTime +
      duration
    );

  }

  catch (error) {

    console.log("Beep error:", error);

  }

}


/* =========================
   SUARA BERHASIL
========================= */

function suaraBerhasil() {

  beep(800, 0.15);

  setTimeout(function() {

    beep(1200, 0.25);

  }, 200);

}


/* =========================
   BERSIHKAN SCANNER
========================= */

function bersihkanScanner() {

  return new Promise(function(resolve) {

    if (!scanner) {

      document.getElementById(
        "reader"
      ).innerHTML = "";

      kameraAktif = false;

      resolve();

      return;
    }


    const lanjutBersihkan =
      function() {

        try {

          scanner.clear()
            .catch(function() {})
            .finally(function() {

              document.getElementById(
                "reader"
              ).innerHTML = "";

              scanner = null;

              kameraAktif = false;

              resolve();

            });

        }

        catch (e) {

          document.getElementById(
            "reader"
          ).innerHTML = "";

          scanner = null;

          kameraAktif = false;

          resolve();

        }

      };


    if (kameraAktif) {

      scanner.stop()

        .then(lanjutBersihkan)

        .catch(lanjutBersihkan);

    }

    else {

      lanjutBersihkan();

    }

  });

}


/* =========================
   MULAI SCANNER
========================= */

function mulaiScanner() {

  const status =
    document.getElementById("status");

  const hasil =
    document.getElementById("hasil");

  const tombol =
    document.getElementById("btnKamera");


  if (kameraAktif) {

    return;

  }


  aktifkanAudio();


  sedangMemproses = false;


  hasil.innerHTML = "";


  tombol.style.display =
    "none";


  status.innerHTML =
    "⏳ Menyiapkan kamera...";


  bersihkanScanner()

    .then(function() {

      scanner =
        new Html5Qrcode("reader");


      return Html5Qrcode.getCameras();

    })

    .then(function(cameras) {

      if (
        !cameras ||
        cameras.length === 0
      ) {

        throw new Error(
          "Kamera tidak ditemukan"
        );

      }


      let cameraId =
        cameras[0].id;


      const kameraBelakang =
        cameras.find(function(camera) {

          return /back|rear|environment/i.test(
            camera.label
          );

        });


      if (kameraBelakang) {

        cameraId =
          kameraBelakang.id;

      }


      return scanner.start(

        cameraId,

        {

          fps: 10,

          qrbox: {

            width: 250,

            height: 250

          }

        },

        qrBerhasil,

        function() {

          // QR belum terbaca

        }

      );

    })

    .then(function() {

      kameraAktif = true;


      status.innerHTML =
        "📷 SIAP SCAN - Arahkan kamera ke QR Code";

    })

    .catch(function(error) {

      console.error(error);


      kameraAktif = false;

      scanner = null;


      tombol.style.display =
        "inline-block";


      status.innerHTML =
        "❌ Kamera tidak dapat dibuka";


      hasil.innerHTML =
        String(
          error.message ||
          error
        );

    });

}


/* =========================
   QR BERHASIL DIBACA
========================= */

function qrBerhasil(decodedText) {

  if (sedangMemproses) {

    return;

  }


  sedangMemproses = true;


  beep(700, 0.12);


  document.getElementById("status")
    .innerHTML =
      "⏳ QR terbaca, memproses absensi...";


  bersihkanScanner()

    .then(function() {

      kirimAbsensi(
        decodedText.trim()
      );

    });

}


/* =========================
   KIRIM ABSENSI
========================= */

function kirimAbsensi(nis) {

  const hasil =
    document.getElementById("hasil");


  hasil.innerHTML =
    "⏳ Menyimpan absensi...";


  const callbackName =
    "callbackAbsensi_" +
    Date.now();


  let selesai = false;


  window[callbackName] =
    function(data) {

      if (selesai) {
        return;
      }

      selesai = true;


      if (data.berhasil) {

        suaraBerhasil();


        document.getElementById("status")
          .innerHTML =
            "✅ ABSENSI BERHASIL";


        hasil.innerHTML =

          "<h2>🎉 Selamat Datang!</h2>" +

          "<h3>" +
          data.nama +
          "</h3>" +

          "<p>Kelas: <b>" +
          data.kelas +
          "</b></p>" +

          "<h2>✅ HADIR</h2>" +

          "<p>📷 Kamera siap kembali dalam 3 detik...</p>";

      }

      else {

        beep(300, 0.4);


        document.getElementById("status")
          .innerHTML =
            "❌ ABSENSI GAGAL";


        hasil.innerHTML =

          "<h3>" +
          data.pesan +
          "</h3>" +

          "<p>📷 Scan berikutnya dalam 3 detik...</p>";

      }


      hapusScript();


      setTimeout(function() {

        hasil.innerHTML = "";

        sedangMemproses = false;

        mulaiScanner();

      }, 3000);

    };


  function hapusScript() {

    const script =
      document.getElementById(
        callbackName
      );


    if (script) {

      script.remove();

    }


    try {

      delete window[callbackName];

    }

    catch (e) {

      window[callbackName] =
        null;

    }

  }


  const script =
    document.createElement("script");


  script.id =
    callbackName;


  script.onerror =
    function() {

      if (selesai) {
        return;
      }

      selesai = true;


      document.getElementById("status")
        .innerHTML =
          "❌ Gagal menghubungi server";


      hasil.innerHTML =
        "<p>Periksa koneksi server.</p>" +

        "<p>📷 Mencoba membuka kamera lagi...</p>";


      hapusScript();


      setTimeout(function() {

        hasil.innerHTML = "";

        sedangMemproses = false;

        mulaiScanner();

      }, 3000);

    };


  script.src =

    API_URL +

    "?action=absensi" +

    "&nis=" +

    encodeURIComponent(nis) +

    "&callback=" +

    encodeURIComponent(callbackName);


  document.body.appendChild(script);

}

</script>

</body>
</html>
