<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Scanner Absensi Siswa</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.15);
    }

    h1 {
      margin-top: 0;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #hasil {
      margin-top: 20px;
      padding: 20px;
      border-radius: 12px;
      font-size: 18px;
      min-height: 30px;
    }

    .standby {
      background: #fff3cd;
    }

    .sukses {
      background: #d4edda;
    }

    .gagal {
      background: #f8d7da;
    }

    #btnKamera {
      padding: 15px 25px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin: 10px;
    }

  </style>

</head>


<body>

  <div class="container">

    <h1>📷 SCANNER ABSENSI</h1>

    <p>
      Tekan tombol lalu arahkan kamera ke QR Code siswa
    </p>


    <button
      id="btnKamera"
      onclick="aktifkanKamera()"
    >
      📷 AKTIFKAN KAMERA
    </button>


    <div id="reader"></div>


    <div
      id="hasil"
      class="standby"
    >
      🟢 Scanner standby
    </div>

  </div>



  <script>

    // ========================================
    // URL GOOGLE APPS SCRIPT
    // ========================================

    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbzy40d8_ON59azK5yuxjIo78ayPkeHBOvHHEKSxvwQX7zcrHMwQyT4qvVdUP1sZ7c-5/exec";



    // ========================================
    // VARIABEL
    // ========================================

    let scanner;

    let sedangProses = false;

    let kameraAktif = false;



    // ========================================
    // SUARA
    // ========================================

    function bicara(teks) {

      window.speechSynthesis.cancel();

      const suara =
        new SpeechSynthesisUtterance(teks);

      suara.lang = "id-ID";

      suara.rate = 0.9;

      suara.pitch = 1;

      window.speechSynthesis.speak(suara);

    }



    // ========================================
    // AKTIFKAN KAMERA
    // ========================================

    async function aktifkanKamera() {

      if (kameraAktif) {
        return;
      }


      const hasil =
        document.getElementById("hasil");


      hasil.className = "standby";

      hasil.innerHTML =
        "⏳ Membuka kamera...";


      try {

        scanner =
          new Html5Qrcode("reader");


        const cameras =
          await Html5Qrcode.getCameras();


        if (
          !cameras ||
          cameras.length === 0
        ) {

          hasil.className = "gagal";

          hasil.innerHTML =
            "❌ Kamera tidak ditemukan.";

          return;

        }


        // Cari kamera belakang
        let cameraId =
          cameras[0].id;


        const kameraBelakang =
          cameras.find(function(camera) {

            return (
              camera.label
                .toLowerCase()
                .includes("back") ||

              camera.label
                .toLowerCase()
                .includes("rear") ||

              camera.label
                .toLowerCase()
                .includes("belakang")
            );

          });


        if (kameraBelakang) {

          cameraId =
            kameraBelakang.id;

        }


        await scanner.start(

          cameraId,

          {
            fps: 10,

            qrbox: {
              width: 250,
              height: 250
            }
          },

          onScanSuccess,

          onScanFailure

        );


        kameraAktif = true;


        document
          .getElementById("btnKamera")
          .style.display = "none";


        hasil.className =
          "standby";


        hasil.innerHTML =
          "🟢 Kamera aktif. Silakan scan QR Code.";


      }

      catch (error) {

        console.error(error);


        hasil.className =
          "gagal";


        hasil.innerHTML =
          "❌ Kamera tidak dapat dibuka.<br><br>" +
          error.message;

      }

    }



    // ========================================
    // QR BERHASIL TERBACA
    // ========================================

    function onScanSuccess(decodedText) {

      if (sedangProses) {
        return;
      }


      sedangProses = true;


      const nis =
        decodedText.trim();


      const hasil =
        document.getElementById("hasil");


      hasil.className =
        "standby";


      hasil.innerHTML =
        "⏳ Memproses absensi...";


      kirimAbsensi(nis);

    }



    // ========================================
    // KIRIM KE GOOGLE APPS SCRIPT
    // ========================================

    async function kirimAbsensi(nis) {

      const hasil =
        document.getElementById("hasil");


      try {

        const response =
          await fetch(

            SCRIPT_URL,

            {

              method: "POST",

              redirect: "follow",

              headers: {
                "Content-Type":
                  "text/plain;charset=utf-8"
              },

              body:
                JSON.stringify({
                  nis: nis
                })

            }

          );


        const text =
          await response.text();


        const data =
          JSON.parse(text);



        // ========================================
        // ABSENSI BERHASIL
        // ========================================

        if (data.berhasil) {

          hasil.className =
            "sukses";


          hasil.innerHTML =

            "🎉 <h2>SELAMAT DATANG!</h2>" +

            "<h2>" +
            data.nama +
            "</h2>" +

            "<p>Kelas: <b>" +
            data.kelas +
            "</b></p>" +

            "<h2>✅ HADIR</h2>";


          bicara(

            "Selamat datang " +

            data.nama +

            ". Absensi Anda berhasil."

          );

        }



        // ========================================
        // SUDAH ABSEN
        // ========================================

        else if (data.sudahAbsen) {

          hasil.className =
            "gagal";


          hasil.innerHTML =

            "⚠️ <h2>" +

            data.nama +

            "</h2>" +

            "<p>Anda sudah melakukan absensi hari ini.</p>";


          bicara(

            "Maaf " +

            data.nama +

            ". Anda sudah melakukan absensi hari ini."

          );

        }



        // ========================================
        // GAGAL
        // ========================================

        else {

          hasil.className =
            "gagal";


          hasil.innerHTML =
            "❌ " +
            data.pesan;


          bicara(
            data.pesan
          );

        }


        // ========================================
        // KEMBALI STANDBY
        // ========================================

        setTimeout(function() {

          hasil.className =
            "standby";


          hasil.innerHTML =
            "🟢 Scanner standby. Silakan scan QR berikutnya.";


          sedangProses =
            false;


        }, 4000);


      }

      catch (error) {

        console.error(error);


        hasil.className =
          "gagal";


        hasil.innerHTML =
          "❌ Gagal menghubungi server.<br><small>" +
          error.message +
          "</small>";


        bicara(
          "Terjadi kesalahan. Silakan coba lagi."
        );


        setTimeout(function() {

          hasil.className =
            "standby";


          hasil.innerHTML =
            "🟢 Scanner standby. Silakan coba lagi.";


          sedangProses =
            false;


        }, 4000);

      }

    }



    // ========================================
    // QR BELUM TERBACA
    // ========================================

    function onScanFailure(error) {

      // Tidak perlu melakukan apa-apa.
      // Scanner akan terus mencari QR Code.

    }

  </script>

</body>

</html>
