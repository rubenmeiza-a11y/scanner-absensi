<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Scanner Absensi</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #121212;
  color: white;
  text-align: center;
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 25px 15px;
}

h1 {
  margin-top: 20px;
}

#reader {
  width: 100%;
  margin-top: 25px;
  border-radius: 15px;
  overflow: hidden;
}

#hasil {
  margin-top: 25px;
  padding: 20px;
  border-radius: 15px;
  font-size: 20px;
  min-height: 60px;
}

.sukses {
  background: #14532d;
}

.gagal {
  background: #7f1d1d;
}

.proses {
  background: #374151;
}

</style>
</head>

<body>

<div class="container">

  <h1>📷 SCANNER ABSENSI</h1>

  <p>Arahkan kamera ke QR Code siswa</p>

  <div id="reader"></div>

  <div id="hasil">
    📷 Menunggu QR Code...
  </div>

</div>


<script>

const API_URL =
'https://script.google.com/macros/s/AKfycbwOWTy4CvzqBCclnewpC7pkrdi04FTXFffX61AoS0wBv2HmubytcLjmUNBb0WIb4D4j/exec';

let sedangProses = false;


function kirimAbsensi(nis) {

  if (sedangProses) {
    return;
  }

  sedangProses = true;

  const hasil =
    document.getElementById('hasil');

  hasil.className = 'proses';

  hasil.innerHTML =
    '⏳ Memproses absensi...';


  const callbackName =
    'callbackAbsensi_' + Date.now();


  window[callbackName] =
    function(data) {

      if (data.berhasil) {

        hasil.className = 'sukses';

        hasil.innerHTML =
          '<h2>🎉 SELAMAT DATANG!</h2>' +
          '<h3>' + data.nama + '</h3>' +
          '<p>Kelas: <b>' +
          data.kelas +
          '</b></p>' +
          '<h2>✅ HADIR</h2>';

      } else {

        hasil.className = 'gagal';

        hasil.innerHTML =
          '❌ ' + data.pesan;

      }


      delete window[callbackName];

      const scriptLama =
        document.getElementById(
          callbackName
        );

      if (scriptLama) {

        scriptLama.remove();

      }


      setTimeout(function() {

        sedangProses = false;

        hasil.className = '';

        hasil.innerHTML =
          '📷 Silakan scan QR berikutnya...';

      }, 4000);

    };


  const script =
    document.createElement('script');


  script.id =
    callbackName;


  script.onerror =
    function() {

      hasil.className = 'gagal';

      hasil.innerHTML =
        '❌ Gagal menghubungi server.';


      delete window[callbackName];


      setTimeout(function() {

        sedangProses = false;

        hasil.className = '';

        hasil.innerHTML =
          '📷 Coba scan kembali...';

      }, 3000);

    };


  script.src =
    API_URL +
    '?action=absensi' +
    '&nis=' +
    encodeURIComponent(nis) +
    '&callback=' +
    callbackName;


  document.body.appendChild(script);

}



function onScanSuccess(decodedText) {

  kirimAbsensi(decodedText);

}



function onScanFailure(error) {

}



const html5QrCode =
  new Html5QrcodeScanner(

    'reader',

    {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      }
    },

    false

  );


html5QrCode.render(
  onScanSuccess,
  onScanFailure
);

</script>

</body>
</html>
