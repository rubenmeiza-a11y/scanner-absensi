<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Scanner Absensi</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 20px;
    }

    h1 {
      margin-top: 0;
    }

    button {
      padding: 14px 25px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #status {
      margin: 20px 0;
      font-size: 18px;
    }

    #hasil {
      margin-top: 20px;
      padding: 15px;
      font-size: 20px;
    }

  </style>

</head>

<body>

<div class="container">

  <h1>📷 SCANNER ABSENSI</h1>

  <div id="status">
    Tekan tombol untuk membuka kamera
  </div>

  <button onclick="mulaiScanner()">
    📷 BUKA KAMERA
  </button>

  <div id="reader"></div>

  <div id="hasil"></div>

</div>


<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycby8EJnWuVNiHaraBqTjwfBkGmhikNSArEbArp8balvhDkN3xWGXgBOh_XVBkJjaQOTP/exec";

let scanner = null;
let sedangMemproses = false;


function mulaiScanner() {

  const status =
    document.getElementById("status");

  const hasil =
    document.getElementById("hasil");


  hasil.innerHTML = "";


  if (scanner) {

    try {

      scanner.clear();

    } catch (e) {}

  }


  scanner =
    new Html5Qrcode("reader");


  status.innerHTML =
    "⏳ Membuka kamera...";


  Html5Qrcode.getCameras()

    .then(function(cameras) {

      if (!cameras ||
          cameras.length === 0) {

        throw new Error(
          "Kamera tidak ditemukan"
        );

      }


      let cameraId =
        cameras[0].id;


      const kameraBelakang =
        cameras.find(function(camera) {

          return /back|rear|environment/i.test(
            camera.label
          );

        });


      if (kameraBelakang) {

        cameraId =
          kameraBelakang.id;

      }


      return scanner.start(

        cameraId,

        {
          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          }

        },

        qrBerhasil,

        function() {

          // QR belum terbaca

        }

      );

    })

    .then(function() {

      status.innerHTML =
        "📷 Arahkan kamera ke QR Code";

    })

    .catch(function(error) {

      console.error(error);


      status.innerHTML =
        "❌ Kamera tidak dapat dibuka";


      hasil.innerHTML =
        error.message ||
        String(error);

    });

}



function qrBerhasil(decodedText) {

  if (sedangMemproses) {

    return;

  }


  sedangMemproses = true;


  document.getElementById("status")
    .innerHTML =
      "⏳ QR terbaca, memproses absensi...";


  if (scanner) {

    scanner.stop()

      .then(function() {

        kirimAbsensi(decodedText);

      })

      .catch(function() {

        kirimAbsensi(decodedText);

      });

  }

  else {

    kirimAbsensi(decodedText);

  }

}



function kirimAbsensi(nis) {

  const hasil =
    document.getElementById("hasil");


  hasil.innerHTML =
    "⏳ Menyimpan absensi...";


  const callbackName =
    "callbackAbsensi_" +
    Date.now();


  window[callbackName] =
    function(data) {

      if (data.berhasil) {

        document.getElementById("status")
          .innerHTML =
            "✅ ABSENSI BERHASIL";


        hasil.innerHTML =

          "<h2>🎉 Selamat Datang!</h2>" +

          "<h3>" +
          data.nama +
          "</h3>" +

          "<p>Kelas: <b>" +
          data.kelas +
          "</b></p>" +

          "<h2>✅ HADIR</h2>";

      }

      else {

        document.getElementById("status")
          .innerHTML =
            "❌ ABSENSI GAGAL";


        hasil.innerHTML =
          "<h3>" +
          data.pesan +
          "</h3>";

      }


      const script =
        document.getElementById(
          callbackName
        );


      if (script) {

        script.remove();

      }


      delete window[callbackName];


      setTimeout(function() {

        sedangMemproses = false;

      }, 3000);

    };


  const script =
    document.createElement("script");


  script.id =
    callbackName;


  script.onerror =
    function() {

      document.getElementById("status")
        .innerHTML =
          "❌ Gagal menghubungi server";


      hasil.innerHTML =
        "Periksa link Google Apps Script.";


      sedangMemproses = false;

    };


  script.src =

    API_URL +

    "?action=absensi" +

    "&nis=" +

    encodeURIComponent(nis) +

    "&callback=" +

    callbackName;


  document.body.appendChild(script);

}

</script>

</body>
</html>
