<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Scanner Absensi</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 20px;
    }

    button {
      padding: 14px 25px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #status {
      margin: 20px 0;
      font-size: 18px;
    }

    #hasil {
      margin-top: 20px;
      padding: 15px;
      font-size: 20px;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>📷 SCANNER ABSENSI</h1>

  <div id="status">
    Tekan tombol untuk membuka kamera
  </div>


  <button
    id="btnKamera"
    onclick="mulaiScanner()"
  >
    📷 BUKA KAMERA
  </button>


  <div id="reader"></div>

  <div id="hasil"></div>

</div>


<script>

/* =================================
   GOOGLE APPS SCRIPT
================================= */

const API_URL =
  "https://script.google.com/a/macros/admin.sd.belajar.id/s/AKfycby8EJnWuVNiHaraBqTjwfBkGmhikNSArEbArp8balvhDkN3xWGXgBOh_XVBkJjaQOTP/exec";


/* =================================
   VARIABEL
================================= */

let scanner = null;

let sedangMemproses = false;

let kameraAktif = false;

let audioContext = null;


/* =================================
   AKTIFKAN AUDIO
   Dipanggil saat tombol ditekan
================================= */

async function aktifkanAudio() {

  try {

    const AudioContextClass =
      window.AudioContext ||
      window.webkitAudioContext;


    if (!audioContext) {

      audioContext =
        new AudioContextClass();

    }


    if (
      audioContext.state === "suspended"
    ) {

      await audioContext.resume();

    }


    /*
      Bunyi kecil untuk memastikan
      audio browser aktif
    */

    const oscillator =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();


    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );


    oscillator.frequency.value =
      440;


    gain.gain.setValueAtTime(
      0.01,
      audioContext.currentTime
    );


    oscillator.start();

    oscillator.stop(
      audioContext.currentTime + 0.05
    );


    console.log(
      "Audio berhasil diaktifkan"
    );

  }

  catch (error) {

    console.log(
      "Audio error:",
      error
    );

  }

}


/* =================================
   FUNGSI BEEP
================================= */

function beep(
  frequency,
  duration,
  volume = 0.5
) {

  if (!audioContext) {

    return;

  }


  try {

    if (
      audioContext.state === "suspended"
    ) {

      audioContext.resume();

    }


    const oscillator =
      audioContext.createOscillator();


    const gain =
      audioContext.createGain();


    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );


    oscillator.type =
      "sine";


    oscillator.frequency.setValueAtTime(
      frequency,
      audioContext.currentTime
    );


    gain.gain.setValueAtTime(
      volume,
      audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      0.01,
      audioContext.currentTime +
      duration
    );


    oscillator.start(
      audioContext.currentTime
    );


    oscillator.stop(
      audioContext.currentTime +
      duration
    );

  }

  catch (error) {

    console.log(
      "Beep error:",
      error
    );

  }

}


/* =================================
   SUARA QR TERBACA
================================= */

function suaraQR() {

  beep(
    700,
    0.12,
    0.6
  );

}


/* =================================
   SUARA ABSENSI BERHASIL
================================= */

function suaraBerhasil() {

  /*
    Nada 1
  */

  beep(
    700,
    0.15,
    0.7
  );


  /*
    Nada 2
  */

  setTimeout(function() {

    beep(
      900,
      0.15,
      0.7
    );

  }, 180);


  /*
    Nada 3
  */

  setTimeout(function() {

    beep(
      1200,
      0.35,
      0.8
    );

  }, 360);

}


/* =================================
   SUARA GAGAL
================================= */

function suaraGagal() {

  beep(
    250,
    0.5,
    0.7
  );

}


/* =================================
   BERSIHKAN SCANNER
================================= */

function bersihkanScanner() {

  return new Promise(
    function(resolve) {

      if (!scanner) {

        document
          .getElementById(
            "reader"
          )
          .innerHTML = "";


        kameraAktif =
          false;


        resolve();

        return;

      }


      const selesai =
        function() {

          try {

            scanner.clear()

              .catch(
                function() {}
              )

              .finally(
                function() {

                  document
                    .getElementById(
                      "reader"
                    )
                    .innerHTML = "";


                  scanner =
                    null;


                  kameraAktif =
                    false;


                  resolve();

                }
              );

          }

          catch (error) {

            document
              .getElementById(
                "reader"
              )
              .innerHTML = "";


            scanner =
              null;


            kameraAktif =
              false;


            resolve();

          }

        };


      if (kameraAktif) {

        scanner.stop()

          .then(selesai)

          .catch(selesai);

      }

      else {

        selesai();

      }

    }
  );

}


/* =================================
   MULAI SCANNER
================================= */

async function mulaiScanner() {

  const status =
    document.getElementById(
      "status"
    );


  const hasil =
    document.getElementById(
      "hasil"
    );


  const tombol =
    document.getElementById(
      "btnKamera"
    );


  if (kameraAktif) {

    return;

  }


  /*
    Audio hanya perlu diaktifkan
    ketika pengguna menekan tombol
  */

  await aktifkanAudio();


  sedangMemproses =
    false;


  hasil.innerHTML =
    "";


  tombol.style.display =
    "none";


  status.innerHTML =
    "⏳ Menyiapkan kamera...";


  bersihkanScanner()

    .then(
      function() {

        scanner =
          new Html5Qrcode(
            "reader"
          );


        return Html5Qrcode
          .getCameras();

      }
    )


    .then(
      function(cameras) {

        if (
          !cameras ||
          cameras.length === 0
        ) {

          throw new Error(
            "Kamera tidak ditemukan"
          );

        }


        let cameraId =
          cameras[0].id;


        const kameraBelakang =
          cameras.find(
            function(camera) {

              return /back|rear|environment/i.test(
                camera.label
              );

            }
          );


        if (kameraBelakang) {

          cameraId =
            kameraBelakang.id;

        }


        return scanner.start(

          cameraId,

          {

            fps: 10,

            qrbox: {

              width: 250,

              height: 250

            }

          },


          qrBerhasil,


          function() {

            /*
              QR belum terbaca
            */

          }

        );

      }
    )


    .then(
      function() {

        kameraAktif =
          true;


        status.innerHTML =
          "📷 SIAP SCAN - Arahkan kamera ke QR Code";

      }
    )


    .catch(
      function(error) {

        console.error(
          error
        );


        kameraAktif =
          false;


        scanner =
          null;


        tombol.style.display =
          "inline-block";


        status.innerHTML =
          "❌ Kamera tidak dapat dibuka";


        hasil.innerHTML =
          String(
            error.message ||
            error
          );

      }
    );

}


/* =================================
   QR BERHASIL DIBACA
================================= */

function qrBerhasil(decodedText) {

  if (sedangMemproses) {

    return;

  }


  sedangMemproses =
    true;


  /*
    BUNYI QR TERBACA
  */

  suaraQR();


  document
    .getElementById(
      "status"
    )
    .innerHTML =
      "⏳ QR terbaca, memproses absensi...";


  /*
    Matikan kamera sementara
  */

  bersihkanScanner()

    .then(
      function() {

        kirimAbsensi(
          decodedText.trim()
        );

      }
    );

}


/* =================================
   KIRIM ABSENSI
================================= */

function kirimAbsensi(nis) {

  const hasil =
    document.getElementById(
      "hasil"
    );


  hasil.innerHTML =
    "⏳ Menyimpan absensi...";


  const callbackName =
    "callbackAbsensi_" +
    Date.now();


  let selesai =
    false;


  /*
    CALLBACK JSONP
  */

  window[callbackName] =
    function(data) {

      if (selesai) {

        return;

      }


      selesai =
        true;


      /*
        ABSENSI BERHASIL
      */

      if (data.berhasil) {

        /*
          BUNYI BERHASIL
        */

        suaraBerhasil();


        document
          .getElementById(
            "status"
          )
          .innerHTML =
            "✅ ABSENSI BERHASIL";


        hasil.innerHTML =

          "<h2>🎉 Selamat Datang!</h2>" +

          "<h3>" +
          data.nama +
          "</h3>" +

          "<p>Kelas: <b>" +
          data.kelas +
          "</b></p>" +

          "<h2>✅ HADIR</h2>" +

          "<p>📷 Kamera siap kembali dalam 3 detik...</p>";

      }


      /*
        ABSENSI GAGAL
      */

      else {

        suaraGagal();


        document
          .getElementById(
            "status"
          )
          .innerHTML =
            "❌ ABSENSI GAGAL";


        hasil.innerHTML =

          "<h3>" +
          data.pesan +
          "</h3>" +

          "<p>📷 Scan berikutnya dalam 3 detik...</p>";

      }


      hapusScript();


      /*
        KEMBALI KE SCANNER
      */

      setTimeout(
        function() {

          hasil.innerHTML =
            "";


          sedangMemproses =
            false;


          mulaiScanner();

        },
        3000
      );

    };


  /*
    HAPUS SCRIPT JSONP
  */

  function hapusScript() {

    const script =
      document.getElementById(
        callbackName
      );


    if (script) {

      script.remove();

    }


    try {

      delete window[
        callbackName
      ];

    }

    catch (e) {

      window[
        callbackName
      ] =
        null;

    }

  }


  /*
    BUAT SCRIPT JSONP
  */

  const script =
    document.createElement(
      "script"
    );


  script.id =
    callbackName;


  /*
    JIKA SERVER ERROR
  */

  script.onerror =
    function() {

      if (selesai) {

        return;

      }


      selesai =
        true;


      suaraGagal();


      document
        .getElementById(
          "status"
        )
        .innerHTML =
          "❌ Gagal menghubungi server";


      hasil.innerHTML =

        "<p>Periksa koneksi server.</p>" +

        "<p>📷 Mencoba membuka kamera lagi...</p>";


      hapusScript();


      setTimeout(
        function() {

          hasil.innerHTML =
            "";


          sedangMemproses =
            false;


          mulaiScanner();

        },
        3000
      );

    };


  /*
    URL API
  */

  script.src =

    API_URL +

    "?action=absensi" +

    "&nis=" +

    encodeURIComponent(
      nis
    ) +

    "&callback=" +

    encodeURIComponent(
      callbackName
    );


  document.body.appendChild(
    script
  );

}

</script>

</body>

</html>
