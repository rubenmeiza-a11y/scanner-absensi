<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Scanner Absensi</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 650px;
      margin: 30px auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.15);
    }

    h1 {
      margin-top: 0;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      overflow: hidden;
      border-radius: 12px;
    }

    #hasil {
      margin-top: 20px;
      padding: 20px;
      font-size: 20px;
      border-radius: 12px;
      min-height: 70px;
    }

    .sukses {
      background: #d4edda;
    }

    .gagal {
      background: #f8d7da;
    }

    .proses {
      background: #fff3cd;
    }

    .standby {
      margin-top: 20px;
      font-size: 18px;
      color: #555;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      cursor: pointer;
      border-radius: 10px;
      border: 1px solid #888;
      background: white;
    }

  </style>
</head>

<body>

<div class="container">

  <h1>📷 SCANNER ABSENSI</h1>

  <p>Arahkan QR Code siswa ke kamera</p>

  <button id="btnKamera">
    📷 AKTIFKAN KAMERA
  </button>

  <div id="reader"></div>

  <div id="hasil" class="proses">
    📷 Tekan tombol AKTIFKAN KAMERA
  </div>

  <div class="standby">
    🟢 Scanner standby
  </div>

</div>


<script>

  // ==========================================
  // GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT
  // ==========================================

  const API_URL =
    "PASTE_URL_WEB_APP_ANDA_DI_SINI";


  let html5QrCode = null;
  let sedangProses = false;
  let kameraAktif = false;


  // ==========================================
  // SUARA
  // ==========================================

  function bicara(teks) {

    if (!("speechSynthesis" in window)) {
      return;
    }

    window.speechSynthesis.cancel();

    const suara =
      new SpeechSynthesisUtterance(teks);

    suara.lang = "id-ID";
    suara.rate = 0.9;
    suara.pitch = 1;

    window.speechSynthesis.speak(suara);

  }


  // ==========================================
  // PESAN
  // ==========================================

  function tampilPesan(
    pesan,
    status
  ) {

    const hasil =
      document.getElementById("hasil");

    hasil.className = status;

    hasil.innerHTML = pesan;

  }


  // ==========================================
  // AKTIFKAN KAMERA
  // ==========================================

  document
    .getElementById("btnKamera")
    .addEventListener(
      "click",
      aktifkanKamera
    );


  async function aktifkanKamera() {

    if (kameraAktif) {
      return;
    }


    tampilPesan(
      "⏳ Membuka kamera...",
      "proses"
    );


    try {

      html5QrCode =
        new Html5Qrcode("reader");


      // Cari daftar kamera

      const devices =
        await Html5Qrcode.getCameras();


      if (!devices ||
          devices.length === 0) {

        throw new Error(
          "Kamera tidak ditemukan"
        );

      }


      // Prioritas kamera belakang

      let cameraId =
        devices[0].id;


      const kameraBelakang =
        devices.find(
          device => {

            const label =
              device.label.toLowerCase();

            return (
              label.includes("back") ||
              label.includes("rear") ||
              label.includes("environment")
            );

          }
        );


      if (kameraBelakang) {

        cameraId =
          kameraBelakang.id;

      }


      await html5QrCode.start(

        cameraId,

        {
          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          }

        },

        onScanSuccess,

        onScanFailure

      );


      kameraAktif = true;


      document
        .getElementById("btnKamera")
        .style.display = "none";


      tampilPesan(
        "📷 Kamera aktif. Silakan scan QR Code.",
        "proses"
      );


    }

    catch (error) {

      console.error(error);


      kameraAktif = false;


      let pesan =
        "Kamera tidak dapat dibuka.";


      if (
        error.name ===
        "NotAllowedError"
      ) {

        pesan =
          "❌ Izin kamera ditolak. Silakan izinkan kamera pada browser.";

      }

      else if (
        error.name ===
        "NotFoundError"
      ) {

        pesan =
          "❌ Kamera tidak ditemukan.";

      }

      else {

        pesan =
          "❌ Kamera tidak dapat dibuka.<br><br>" +
          error;

      }


      tampilPesan(
        pesan,
        "gagal"
      );

    }

  }


  // ==========================================
  // QR BERHASIL DIBACA
  // ==========================================

  async function onScanSuccess(
    decodedText
  ) {

    if (sedangProses) {
      return;
    }


    sedangProses = true;


    const nis =
      decodedText.trim();


    tampilPesan(
      "⏳ Memproses absensi...",
      "proses"
    );


    try {

      // ====================================
      // KIRIM NIS KE GOOGLE APPS SCRIPT
      // ====================================

      const response =
        await fetch(

          API_URL +
          "?action=absensiQR" +
          "&nis=" +
          encodeURIComponent(nis)

        );


      const data =
        await response.json();


      // ====================================
      // BERHASIL
      // ====================================

      if (data.berhasil) {

        tampilPesan(

          "🎉 <h2>Selamat Datang!</h2>" +
          "<h2>" +
          data.nama +
          "</h2>" +

          "<p>Kelas: <b>" +
          data.kelas +
          "</b></p>" +

          "<h3>✅ HADIR</h3>",

          "sukses"

        );


        bicara(

          "Selamat datang, " +
          data.nama +
          ". Absensi Anda berhasil."

        );

      }


      // ====================================
      // SUDAH ABSEN
      // ====================================

      else if (
        data.sudahAbsen
      ) {

        tampilPesan(

          "⚠️ <h3>" +
          data.nama +
          "</h3>" +

          "<p>Anda sudah melakukan absensi hari ini.</p>",

          "gagal"

        );


        bicara(

          "Maaf " +
          data.nama +
          ". Anda sudah melakukan absensi hari ini."

        );

      }


      // ====================================
      // GAGAL
      // ====================================

      else {

        tampilPesan(

          "❌ " +
          data.pesan,

          "gagal"

        );


        bicara(
          data.pesan
        );

      }


    }

    catch (error) {

      console.error(error);


      tampilPesan(

        "❌ Terjadi kesalahan saat menghubungi server.",

        "gagal"

      );

    }


    // ====================================
    // KEMBALI STANDBY
    // ====================================

    setTimeout(
      function() {

        tampilPesan(

          "📷 Silakan scan QR Code berikutnya",

          "proses"

        );


        sedangProses = false;

      },

      4000
    );

  }


  // ==========================================
  // QR BELUM TERBACA
  // ==========================================

  function onScanFailure(error) {

    // Biarkan scanner terus mencari QR

  }

</script>

</body>
</html>
